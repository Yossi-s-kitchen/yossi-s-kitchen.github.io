<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D63C1F">
<title>במטבח של יוסי</title>
<meta property="og:title" content="במטבח של יוסי">
<meta property="og:description" content="מזמינים ארוחת בוקר וצהריים אצל יוסי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@400;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: kiosk ordering screen — sticky brand header, big tappable tiles, fixed cart bar at the bottom */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#211A15; --muted:#6E655D; --line:#E4DED5;
  --accent:#D63C1F; --accent-ink:#FFFFFF; --butter:#FFC83D; --butter-ink:#2A1F05;
  --ok:#2F8A4C; --sel:#FFF2E9; --wa:#1F9D55;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110E; --surface:#221C18; --ink:#F6EFE7; --muted:#B3A79B; --line:#3A312A;
  --accent:#FF6A49; --accent-ink:#1A0D08; --butter:#FFD261; --butter-ink:#2A1F05;
  --ok:#5CC27E; --sel:#3A2318; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#221C18; --ink:#F6EFE7; --muted:#B3A79B; --line:#3A312A;
  --accent:#FF6A49; --accent-ink:#1A0D08; --butter:#FFD261; --butter-ink:#2A1F05;
  --ok:#5CC27E; --sel:#3A2318; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;min-height:100%}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit}
.brand svg{width:46px;height:46px;flex:none}
.brand b{font-family:var(--display);font-weight:900;font-size:1.45rem;letter-spacing:-.01em;line-height:1}
.chef-btn{margin-inline-start:auto;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:.9rem;color:inherit}
:root[data-theme="dark"] .chef-btn{background:rgba(0,0,0,.18)}

main{padding-block:20px 140px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-weight:900;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.05}
h2{font-weight:800;font-size:1.45rem}
h3{font-weight:700;font-size:1.1rem}
.lead{color:var(--muted);margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;transition:transform .15s,border-color .15s}
.cat:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat svg{width:100%;max-width:100%;height:130px}
.cat b{font-family:var(--display);font-weight:800;font-size:1.5rem}
.cat span{color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{position:relative;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;font-family:var(--display);font-weight:700;font-size:1.05rem;text-align:center;transition:transform .12s,border-color .12s,background .12s}
.tile:active{transform:scale(.96)}
.tile .dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.4rem;color:#2A1F05}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.95rem;font-weight:900}

.btn{border:0;border-radius:999px;padding:14px 24px;font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--butter);color:var(--butter-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-block}
.btn.wa,.btn.xl{background:var(--wa);color:#fff}
.btn .ic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-inline-end:6px}
.btn.sm{padding:8px 14px;font-size:.92rem}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.95rem}
.pill button{border:0;background:none;padding:0 2px;color:var(--muted);font-weight:900}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;font-weight:900;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
input[type=text],input[type=password]{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem}
input:focus{border-color:var(--accent);outline:none}
.err{color:var(--accent);font-weight:700;min-height:1.5em;margin:0}
.note{color:var(--muted);font-size:.95rem}

.cartbar{position:fixed;inset:auto 0 0;z-index:6;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.cartbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.cartbar .count{width:40px;height:40px;border-radius:50%;background:var(--butter);color:var(--butter-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums}
.cartbar .lbl{font-family:var(--display);font-weight:700;min-width:0}
.cartbar .btn{margin-inline-start:auto}

.line{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .what{flex:1;min-width:0}
.line .what b{font-family:var(--display)}
.line .what div{color:var(--muted)}

.gate{min-height:70vh;display:grid;place-items:center;text-align:center}
.gate .card{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.gate svg{width:110px;height:110px;margin:0 auto}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sum .panel h3{margin-bottom:8px}
.tally{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.tally span:last-child{font-weight:700}
.order h3{display:flex;gap:8px;align-items:baseline}
.order h3 small{color:var(--muted);font-family:var(--body);font-weight:400;font-size:.85rem}
.mine .line .what .pill{margin-inline-start:6px;font-size:.8rem;padding:1px 10px}
.mine .line{flex-wrap:wrap}
.banner{background:var(--butter);color:var(--butter-ink);border-radius:14px;padding:12px 16px;font-weight:600}
.done{text-align:center;padding-top:40px}
.done .big{font-size:4rem;line-height:1}
#pdf{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111;font-family:"Assistant",Arial,sans-serif;direction:rtl;padding:40px;font-size:16px}
#pdf h1{font-family:"Rubik",Arial,sans-serif;font-size:30px;margin:0 0 4px}
#pdf .o{border-top:1px solid #ccc;padding:10px 0}
#pdf .o b{font-size:18px}
#pdf .t{display:flex;justify-content:space-between;padding:2px 0}
#pdf .tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px;border:1.5px solid #8a8a8a}
#pdf .tb th{background:#E7E6E6;color:#111;text-align:right;padding:7px 9px;font-family:"Rubik",Arial,sans-serif;border:1px solid #8a8a8a}
#pdf .tb td{border:1px solid #b5b5b5;padding:7px 9px;vertical-align:top;text-align:right}
#pdf .tb .n{text-align:center;font-variant-numeric:tabular-nums}
.tscroll{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.otable{width:100%;border-collapse:collapse;table-layout:fixed}
.otable th{background:var(--ink);color:var(--bg);text-align:right;padding:9px 8px;font-family:var(--display);font-weight:700;font-size:.85rem}
.otable td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;font-size:.95rem}
.otable .n{font-variant-numeric:tabular-nums;font-weight:700}
.otable .tm{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.otable td.st{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.otable td.st .x{font-size:1rem;padding:2px}
.otable tr.isdone td:not(.st){opacity:.5}
.otable tr.isdone td.what{text-decoration:line-through}
.panel.isdone{opacity:.55}
.chk{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 6px;text-align:center;font-family:var(--display);font-weight:700;font-size:.85rem;white-space:nowrap}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.meal-sec{display:flex;flex-direction:column;gap:12px;padding-top:8px;border-top:3px solid var(--line)}
.sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill.warn{background:var(--butter);color:var(--butter-ink);border-color:transparent;font-weight:700}
.pill.good{background:var(--ok);color:#fff;border-color:transparent;font-weight:700}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ticker{background:var(--butter);color:var(--butter-ink)}
.tk-row{display:flex;align-items:center;gap:10px;padding-block:7px}
.tk-label{flex:none;background:var(--butter-ink);color:var(--butter);border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:800;font-size:.85rem}
.tk-view{flex:1;min-width:0;overflow:hidden;direction:ltr}
.tk-track{display:inline-block;white-space:nowrap;padding-left:100%;font-family:var(--display);font-weight:700;font-size:1rem;animation:marq var(--dur,18s) linear infinite}
.tk-track .sep{opacity:.5;padding:0 18px}
@keyframes marq{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tk-track{animation:none;padding-left:0;white-space:normal}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="brand" data-act="home" aria-label="למסך הבית">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="#FFFFFF"/>
        <circle cx="32" cy="32" r="27" fill="#5BC0EB"/>
        <path d="M10 14l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#FFD23F"/>
        <path d="M54 40l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#FFFFFF"/>
        <path d="M17 52V29c-6-2-8-9-3-14 6-5 13-7 18-7s12 2 18 7c5 5 3 12-3 14v23z" fill="#C8742E" stroke="#3B2414" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M21 49V31c-4-2-5-7-2-10 5-4 10-6 13-6s8 2 13 6c3 3 2 8-2 10v18z" fill="#FBD58A"/>
        <path d="M19 26c4-3 9-4 13-4s9 1 13 4l-1 6c-1 3-3 3-4 0-1 4-3 4-4 1-1 5-4 5-5 0-1 3-3 3-4-1-1 3-3 3-4 0z" fill="#FFC21A"/>
        <circle cx="38.5" cy="22.5" r="2.4" fill="#2E7D32"/>
        <circle cx="26" cy="21.5" r="2" fill="#E63946"/>
        <circle cx="26.5" cy="37" r="2.4" fill="#3B2414"/><circle cx="37.5" cy="37" r="2.4" fill="#3B2414"/>
        <circle cx="27.3" cy="36.2" r=".8" fill="#fff"/><circle cx="38.3" cy="36.2" r=".8" fill="#fff"/>
        <circle cx="23" cy="42" r="2.4" fill="#FF8FA3"/><circle cx="41" cy="42" r="2.4" fill="#FF8FA3"/>
        <path d="M28 42.5c2 2.6 6 2.6 8 0" fill="none" stroke="#3B2414" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <b>במטבח של יוסי</b>
    </button>
    <button class="chef-btn" data-act="admin" id="chefBtn" hidden>מצב יוסי</button>
  </div>
  <div class="ticker" id="ticker" hidden>
    <div class="wrap tk-row">
      <span class="tk-label">מודעות</span>
      <div class="tk-view"><div class="tk-track" id="tkTrack" dir="rtl"></div></div>
    </div>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>
<div class="cartbar" id="cartbar" hidden></div>
<div id="pdf" aria-hidden="true"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ENTRY_CODE = "yossi123";
/* ===== הגדרות Firebase: מדביקים כאן את מה שמופיע ב-Firebase (Project settings > Your apps) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAWOeBkzsDwR4gKFdYxnPqdLq1PHmXcfAM",
  authDomain: "yossi-s-kitchen.firebaseapp.com",
  projectId: "yossi-s-kitchen",
  storageBucket: "yossi-s-kitchen.firebasestorage.app",
  messagingSenderId: "447232814476",
  appId: "1:447232814476:web:231b5c952b3eb181cb7aa9"
};
const $main = document.getElementById("main");
const $bar = document.getElementById("cartbar");
const DOT_COLORS = ["#FFC83D","#FF9E7A","#9ED8A4","#9CC9F2","#F7B3D2","#C9B8F5","#F5D49B","#A8E2DD"];

const ls = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const ss = {
  get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},
  del(k){try{sessionStorage.removeItem(k)}catch(e){}}
};

const S = {
  view: ls.get("yk-gate")==="ok" ? "home" : "gate",
  db:null, dbReady:false, dbMissing:false,
  menu:{toppings:[],mains:[],sides:[]}, menuLoaded:false,
  lock:null, lockLoaded:false,
  orders:[], notes:[],
  cart:{toasts:[], meal:null},
  toast:new Set(), main:null, sides:new Set(),
  admin:false, tab:"orders", confirmAll:false, err:"", busy:false,
  name: ls.get("yk-name") || "",
  uid:null, editingId:null, cancelAsk:null
};

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = s => { let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return DOT_COLORS[h%DOT_COLORS.length]; };
const cartCount = () => S.cart.toasts.length + (S.cart.meal?1:0);
const toastText = t => t.length ? t.join(", ") : "טוסט רגיל, בלי תוספות";

/* ---------- illustrations ---------- */
const TOAST_SVG = `<svg viewBox="0 0 200 130" aria-hidden="true"><ellipse cx="100" cy="118" rx="70" ry="8" fill="var(--line)"/><path d="M48 112V58c-14-4-18-22-6-32 14-12 44-16 58-16s44 4 58 16c12 10 8 28-6 32v54z" fill="#E9A65A"/><path d="M58 104V60c-10-4-12-16-4-22 11-9 34-12 46-12s35 3 46 12c8 6 6 18-4 22v44z" fill="#F8D9A0"/><circle cx="82" cy="66" r="8" fill="#3B2A1F"/><circle cx="118" cy="66" r="8" fill="#3B2A1F"/><path d="M86 84c8 7 20 7 28 0" fill="none" stroke="#3B2A1F" stroke-width="5" stroke-linecap="round"/><path d="M64 92h14M122 92h14" stroke="#F28B6E" stroke-width="7" stroke-linecap="round"/></svg>`;
const MEAL_SVG = `<svg viewBox="0 0 200 130" aria-hidden="true"><ellipse cx="100" cy="118" rx="80" ry="8" fill="var(--line)"/><circle cx="100" cy="68" r="52" fill="var(--surface)" stroke="var(--line)" stroke-width="5"/><circle cx="100" cy="68" r="38" fill="var(--bg)"/><path d="M76 66c4-14 30-18 44-8 8 6 6 16-6 18-14 3-40 4-38-10z" fill="#F28B6E"/><path d="M84 62l8 8M96 58l8 9M108 59l7 8" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/><g fill="#fff" stroke="var(--line)" stroke-width="1.5"><ellipse cx="88" cy="88" rx="6" ry="3.5"/><ellipse cx="100" cy="91" rx="6" ry="3.5"/><ellipse cx="112" cy="87" rx="6" ry="3.5"/><ellipse cx="94" cy="96" rx="6" ry="3.5"/><ellipse cx="107" cy="97" rx="6" ry="3.5"/></g><g fill="none" stroke="var(--muted)" stroke-width="4.5" stroke-linecap="round"><path d="M22 26v14M30 26v14M38 26v14M22 40c0 7 16 7 16 0M30 46v52"/></g><ellipse cx="170" cy="38" rx="9" ry="13" fill="var(--muted)"/><path d="M170 50v48" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/></svg>`;

/* ---------- views ---------- */
function vGate(){
  return `<section class="gate"><div class="card">
    ${document.querySelector(".brand svg").outerHTML}
    <h1>ברוכים הבאים</h1>
    <p class="lead">הכניסו את קוד הכניסה שקיבלתם מיוסי</p>
    <input type="password" id="gateCode" placeholder="קוד כניסה" autocomplete="off">
    <p class="err">${esc(S.err)}</p>
    <button class="btn" data-act="gate">כניסה</button>
  </div></section>`;
}
function dbBanner(){
  if (S.dbMissing) return `<div class="banner">אין חיבור לשרת ההזמנות כרגע. בדקו שיש אינטרנט ורעננו את הדף.</div>`;
  return "";
}
function myIds(){ try { return JSON.parse(ls.get("yk-my")||"[]"); } catch(e){ return []; } }
function rememberMine(id){ const a=myIds(); if (!a.includes(id)){ a.push(id); ls.set("yk-my",JSON.stringify(a.slice(-30))); } }
function myOrders(){ const ids=myIds(); return S.orders.filter(o=>(S.uid && o.uid===S.uid) || ids.includes(o.id)); }
const isLocked = o => !!(o.doneB || o.doneL);
function vMine(){
  const mine=myOrders(); if (!mine.length) return "";
  return `<div class="panel stack mine" style="gap:10px"><h2>ההזמנות שלך</h2>
    ${mine.map(o=>{
      const n=S.orders.indexOf(o)+1, locked=isLocked(o);
      const st = o.doneB&&o.doneL || (o.doneB&&!o.main) || (o.doneL&&!(o.toasts||[]).length) ? `<span class="pill good">✓ הוכן</span>` : locked ? `<span class="pill warn">בהכנה</span>` : `<span class="pill">ממתין ליוסי</span>`;
      return `<div class="line"><div class="what"><b>#${n} · ${esc(o.name)}</b> ${st}${itemsOf(o).map(x=>`<div>${esc(x)}</div>`).join("")}
        ${locked?`<div class="note">יוסי כבר התחיל להכין, אז אי אפשר לשנות. לשינוי פנו אליו.</div>`:""}</div>
        ${locked?"":S.cancelAsk===o.id

/* ---------- data ---------- */
async function initDb(){
  let db=null;
  try {
    if (window.firebase && FIREBASE_CONFIG && FIREBASE_CONFIG.projectId){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }
  } catch(e){ console.error(e); }
  if (!db){ S.dbMissing=true; S.menuLoaded=true; S.lockLoaded=true; render(); return; }
  S.db=db;
  S.uid = ls.get("yk-device");
  if (!S.uid){ S.uid = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,10); ls.set("yk-device", S.uid); }
  db.doc("menu/main").onSnapshot(s=>{
    if (!s.exists && !S.seeded && !s.metadata.fromCache){ S.seeded=true; db.doc("menu/main").set({toppings:["גבינה","זיתים","פטריות","חריף"], mains:["סלמון","חזה עוף","פרגית"], sides:["אורז"]}).catch(()=>{}); }
    const d=s.exists?s.data():{};
    S.menu={toppings:[...(d.toppings||[])], mains:[...(d.mains||[])], sides:[...(d.sides||[])]};
    S.menuLoaded=true; if (S.view!=="admin"||S.tab==="menu"||!S.admin) safeRender();
  }, ()=>{});
  db.doc("admin/lock").onSnapshot(s=>{
    S.lock = s.exists ? (s.data().code||null) : null; S.lockLoaded=true;
    if (S.lock && ss.get("yk-admin")===S.lock) S.admin=true;
    if (S.view==="admin") safeRender();
  }, ()=>{ S.lockLoaded=true; });
  db.doc("board/main").onSnapshot(s=>{
    S.notes = s.exists ? [...(s.data().notes||[])] : [];
    updateTicker(); safeRender();
  }, ()=>{});
  db.collection("orders").orderBy("at","asc").onSnapshot(q=>{
    S.orders=q.docs.map(d=>({id:d.id,...d.data()}));
    if ((S.view==="admin" && S.admin) || S.view==="home") safeRender();
  }, ()=>{});
}
// running notice line: only rebuilt when the notes change, so the motion never restarts on other renders
let tickerKey = null;
function updateTicker(){
  const key = JSON.stringify(S.notes); if (key===tickerKey) return; tickerKey=key;
  const tr = document.getElementById("tkTrack");
  tr.innerHTML = S.notes.map(esc).join(`<span class="sep">•</span>`);
  const chars = S.notes.join("").length;
  tr.style.setProperty("--dur", Math.max(10, Math.round(chars*0.28 + 8))+"s");
}
async function saveNotes(){
  try { await S.db.doc("board/main").set({notes:S.notes}); }
  catch(e){ S.err="שמירת ההודעה נכשלה."; render(); }
}
// avoid wiping text the person is typing
function safeRender(){
  const a=document.activeElement;
  if (a && a.tagName==="INPUT" && a.value){ const id=a.id, v=a.value; render(); const n=document.getElementById(id); if(n){n.value=v;n.focus();} }
  else render();
}
async function saveMenu(){
  try { await S.db.doc("menu/main").set({toppings:S.menu.toppings, mains:S.menu.mains, sides:S.menu.sides}); }
  catch(e){ S.err="השמירה נכשלה: "+(e.message||e.code||""); render(); }
}

/* ---------- text export (WhatsApp / copy) ---------- */
function ordersText(){
  const s=summary(), L=[], num=o=>S.orders.indexOf(o)+1;
  const t = m => Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`• ${k}: ${v}`);
  const B=S.orders.filter(o=>(o.toasts||[]).length), Ln=S.orders.filter(o=>o.main);
  L.push(`*במטבח של יוסי – הזמנות* (${new Date().toLocaleDateString("he-IL")})`, "");
  if (B.length){
    L.push("*ארוחת בוקר*", "#  |  שם  |  שעה", "──────────");
    for (const o of B){
      L.push(`*#${num(o)}* | ${o.name} | ${timeOf(o)}${o.doneB?" | ✓ הוכן":""}`);
      o.toasts.forEach((x,i)=>L.push(`   • טוסט ${i+1}: ${toastText(x)}`));
    }
    L.push("", `סה"כ טוסטים: ${s.toasts}`, ...t(s.tops), "");
  }
  if (Ln.length){
    L.push("*ארוחת צהריים*", "#  |  שם  |  שעה", "──────────");
    for (const o of Ln){
      L.push(`*#${num(o)}* | ${o.name} | ${timeOf(o)}${o.doneL?" | ✓ הוכן":""}`);
      L.push(`   • ${o.main}${(o.sides||[]).length?" + "+o.sides.join(", "):""}`);
    }
    L.push("", "מנות עיקריות:", ...t(s.mains));
    if (Object.keys(s.sides).length) L.push("תוספות:", ...t(s.sides));
  }
  return L.join("\n");
}
function timeOf(o){ return new Date(o.at).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}); }
function itemsOf(o){
  const out=(o.toasts||[]).map((x,i)=>`טוסט ${i+1}: ${toastText(x)}`);
  if (o.main) out.push(`${o.main}${(o.sides||[]).length?" + "+o.sides.join(", "):""}`);
  return out;
}

/* ---------- PDF ---------- */
function downloadFile(f){
  const u=URL.createObjectURL(f), a=document.createElement("a");
  a.href=u; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}
async function exportPdf(mode){
  const msg = m => { S.pdfMsg=m; render(); };
  if (S.pdfBusy) return;
  S.readyFile=null;
  if (!window.html2canvas || !window.jspdf){ msg("רכיב ה‑PDF לא נטען. רעננו את הדף ונסו שוב."); return; }
  S.pdfBusy=true; msg("מכין את קובץ ה‑PDF…");
  const s=summary(), now=new Date();
  const t = m => Object.entries(m).map(([k,v])=>`<div class="t"><span>${esc(k)}</span><b>${v}</b></div>`).join("")||"<div>—</div>";
  const box=document.getElementById("pdf");
  const num=o=>S.orders.indexOf(o)+1, B=S.orders.filter(o=>(o.toasts||[]).length), Ln=S.orders.filter(o=>o.main);
  box.innerHTML = `<h1>במטבח של יוסי · הזמנות</h1><div>${now.toLocaleDateString("he-IL")} · ${S.orders.length} הזמנות</div>
    ${B.length?`<h2 style="margin-top:22px">ארוחת בוקר</h2>
    <table class="tb"><thead><tr><th style="width:56px">מס'</th><th style="width:140px">שם</th><th>טוסטים</th><th style="width:64px">שעה</th><th style="width:70px">הוכן</th></tr></thead>
    <tbody>${B.map(o=>`<tr><td class="n">${num(o)}</td><td><b>${esc(o.name)}</b></td><td>${o.toasts.map((x,i)=>`<div>טוסט ${i+1}: ${esc(toastText(x))}</div>`).join("")}</td><td class="n">${timeOf(o)}</td><td class="n">${o.doneB?"✓":""}</td></tr>`).join("")}</tbody></table>
    <div style="margin-top:10px;font-size:17px"><b>סה"כ טוסטים: ${s.toasts}</b></div>`:""}
    ${Ln.length?`<h2 style="margin-top:26px">ארוחת צהריים</h2>
    <table class="tb"><thead><tr><th style="width:56px">מס'</th><th style="width:140px">שם</th><th>מנה עיקרית</th><th>תוספות</th><th style="width:64px">שעה</th><th style="width:70px">הוכן</th></tr></thead>
    <tbody>${Ln.map(o=>`<tr><td class="n">${num(o)}</td><td><b>${esc(o.name)}</b></td><td>${esc(o.main)}</td><td>${(o.sides||[]).length?esc(o.sides.join(", ")):"—"}</td><td class="n">${timeOf(o)}</td><td class="n">${o.doneL?"✓":""}</td></tr>`).join("")}</tbody></table>
    <div style="margin-top:10px;font-size:17px"><b>סה"כ ארוחות צהריים: ${Ln.length}</b></div>`:""}`;
  try {
    const canvas = await html2canvas(box,{scale:1.5,backgroundColor:"#ffffff",logging:false});
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4"});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const sliceH = Math.floor(canvas.width*ph/pw);
    for (let y=0, p=0; y<canvas.height; y+=sliceH, p++){
      const c=document.createElement("canvas"); c.width=canvas.width; c.height=Math.min(sliceH,canvas.height-y);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(canvas,0,-y);
      if (p) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,c.height*pw/c.width);
    }
    const file = new File([pdf.output("blob")], `yossi-orders-${now.toISOString().slice(0,10)}.pdf`, {type:"application/pdf"});
    if (mode==="share" && navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:"הזמנות – במטבח של יוסי"}); msg("נשלח."); }
      catch(e){
        if (e && e.name==="AbortError") msg("השליחה בוטלה.");
        else { S.readyFile=file; msg(""); }  // the phone needs a fresh tap to open the share window
      }
    } else {
      downloadFile(file);
      msg(mode==="share" ? "בטלפון הזה אי אפשר לשתף ישירות, אז הקובץ נשמר. שלחו אותו מווטסאפ דרך צירוף קובץ." : "הקובץ נשמר בתיקיית ההורדות.");
    }
  } catch(e){
    console.error(e); msg("יצירת ה‑PDF נכשלה. נסו שוב.");
  }
  finally { box.innerHTML=""; S.pdfBusy=false; render(); }
}

/* ---------- actions ---------- */
const val = id => (document.getElementById(id)?.value||"").trim();
document.addEventListener("click", async ev=>{
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a=b.dataset.act, v=b.dataset.v, i=+b.dataset.i, id=b.dataset.id, k=b.dataset.k;
  S.err="";
  switch(a){
    case "home": if (S.view!=="gate") go("home"); break;
    case "go": go(v); break;
    case "gate":
      if (val("gateCode").toLowerCase()===ENTRY_CODE){ ls.set("yk-gate","ok"); go("home"); }
      else { S.err="הקוד לא נכון. נסו שוב."; render(); }
      break;
    case "top": S.toast.has(v)?S.toast.delete(v):S.toast.add(v); render(); break;
    case "addToast": S.cart.toasts.push([...S.toast]); S.toast.clear(); render(); break;
    case "main": S.main = S.main===v?null:v; render(); break;
    case "side": S.sides.has(v)?S.sides.delete(v):S.sides.add(v); render(); break;
    case "addMeal": if (S.main){ S.cart.meal={main:S.main,sides:[...S.sides]}; S.main=null; S.sides.clear(); go("cart"); } break;
    case "rmToast": S.cart.toasts.splice(i,1); render(); break;
    case "rmMeal": S.cart.meal=null; render(); break;
    case "send": {
      const name=val("who"); S.name=name;
      if (!name){ S.err="כתבו את השם שלכם, כדי שיוסי ידע של מי ההזמנה."; render(); return; }
      if (!S.db){ S.err="אין חיבור לשרת ההזמנות. בדקו שיש אינטרנט ונסו שוב."; render(); return; }
      S.busy=true; render();
      try {
        const body={name, toasts:S.cart.toasts, main:S.cart.meal?.main||null, sides:S.cart.meal?.sides||[]};
        if (S.editingId){
          const cur=S.orders.find(o=>o.id===S.editingId);
          if (!cur){ S.busy=false; S.editingId=null; S.err="ההזמנה הזו כבר לא קיימת (אולי יוסי מחק אותה). אפשר לשלוח אותה כהזמנה חדשה."; render(); return; }
          if (isLocked(cur)){ S.busy=false; S.err="יוסי כבר התחיל להכין את ההזמנה, אז אי אפשר לשנות אותה. פנו אליו."; render(); return; }
          await S.db.doc("orders/"+S.editingId).update(body);
          S.justEdited=true;
        } else {
          const ref=await S.db.collection("orders").add({...body, uid:S.uid||null, at:Date.now()});
          rememberMine(ref.id); S.justEdited=false;
        }
        ls.set("yk-name",name); S.cart={toasts:[],meal:null}; S.editingId=null; S.busy=false; go("done");
      } catch(e){ S.busy=false; S.err = "השליחה נכשלה. בדקו שיש אינטרנט ונסו שוב."; render(); }
      break; }
    case "admin": go("admin"); break;
    case "editMine": {
      const o=S.orders.find(x=>x.id===id); if (!o || isLocked(o)) return;
      S.editingId=id; S.name=o.name; S.cancelAsk=null;
      S.cart={toasts:(o.toasts||[]).map(t=>[...t]), meal:o.main?{main:o.main,sides:[...(o.sides||[])]}:null};
      go("cart"); break; }
    case "cancelEdit": S.editingId=null; S.cart={toasts:[],meal:null}; go("home"); break;
    case "askCancelMine": S.cancelAsk=id; render(); break;
    case "keepMine": S.cancelAsk=null; render(); break;
    case "cancelMine": {
      const o=S.orders.find(x=>x.id===id); S.cancelAsk=null;
      if (!o || isLocked(o)){ render(); return; }
      try { await S.db.doc("orders/"+id).delete(); } catch(e){ S.err="הביטול נכשל. נסו שוב."; render(); }
      break; }
    case "setLock": {
      const c1=val("adminCode"), c2=val("adminCode2");
      if (c1.length<4){ S.err="בחר קוד של 4 תווים לפחות."; render(); return; }
      if (c1!==c2){ S.err="הקודים לא זהים."; render(); return; }
      try { await S.db.doc("admin/lock").set({code:c1}); ss.set("yk-admin",c1); S.lock=c1; S.admin=true; render(); }
      catch(e){ S.err="לא הצלחתי לשמור את הקוד."; render(); }
      break; }
    case "login":
      if (val("adminCode")===S.lock){ ss.set("yk-admin",S.lock); S.admin=true; render(); }
      else { S.err="קוד העריכה לא נכון."; render(); }
      break;
    case "logout": ss.del("yk-admin"); S.admin=false; go("home"); break;
    case "tab": S.tab=v; S.confirmAll=false; render(); break;
    case "addItem": {
      const x=val("add-"+k); if (!x) return;
      if (S.menu[k].includes(x)){ S.err="הפריט כבר קיים."; render(); return; }
      S.menu[k]=[...S.menu[k],x]; render(); await saveMenu(); document.getElementById("add-"+k)?.focus(); break; }
    case "oview": S.oview=v; render(); break;
    case "done": {
      const o=S.orders.find(x=>x.id===id); if (!o) return;
      try { await S.db.doc("orders/"+id).update({[k]: !o[k]}); } catch(e){ S.err="העדכון נכשל."; render(); }
      break; }
    case "delB": {
      const o=S.orders.find(x=>x.id===id); if (!o) return;
      try { if (!o.main) await S.db.doc("orders/"+id).delete(); else await S.db.doc("orders/"+id).update({toasts:[]}); }
      catch(e){ S.err="המחיקה נכשלה."; render(); }
      break; }
    case "addNote": {
      const x=val("noteInput"); if (!x) return;
      S.notes=[...S.notes,x]; updateTicker(); render(); await saveNotes(); document.getElementById("noteInput")?.focus(); break; }
    case "rmNote": S.notes=S.notes.filter((_,j)=>j!==i); updateTicker(); render(); await saveNotes(); break;
    case "rmItem": S.menu[k]=S.menu[k].filter((_,j)=>j!==i); render(); await saveMenu(); break;
    case "changeLock": {
      const c=val("newLock"); if (c.length<4){ S.err="קוד של 4 תווים לפחות."; render(); return; }
      try { await S.db.doc("admin/lock").set({code:c}); ss.set("yk-admin",c); S.err=""; render(); } catch(e){ S.err="השמירה נכשלה."; render(); }
      break; }
    case "delOrder": try { await S.db.doc("orders/"+id).delete(); } catch(e){ S.err="המחיקה נכשלה."; render(); } break;
    case "delToast": case "delMeal": {
      const o=S.orders.find(x=>x.id===id); if (!o) return;
      const toasts = a==="delToast" ? o.toasts.filter((_,j)=>j!==i) : [...(o.toasts||[])];
      const main = a==="delMeal" ? null : o.main, sides = a==="delMeal" ? [] : (o.sides||[]);
      try {
        if (!toasts.length && !main) await S.db.doc("orders/"+id).delete();
        else await S.db.doc("orders/"+id).update({toasts, main, sides});
      } catch(e){ S.err="המחיקה נכשלה."; render(); }
      break; }
    case "askWipe": S.confirmAll=true; render(); break;
    case "cancelWipe": S.confirmAll=false; render(); break;
    case "wipe":
      S.confirmAll=false; render();
      for (const o of [...S.orders]){ try { await S.db.doc("orders/"+o.id).delete(); } catch(e){} }
      break;
    case "pdf": exportPdf(v); break;
    case "shareReady": {
      const f=S.readyFile; if (!f) return;
      try { await navigator.share({files:[f], title:"הזמנות – במטבח של יוסי"}); S.readyFile=null; S.pdfMsg="נשלח."; }
      catch(e){ if (e && e.name==="AbortError"){ S.pdfMsg="השליחה בוטלה."; } else { downloadFile(f); S.readyFile=null; S.pdfMsg="השליחה לא נתמכת כאן, אז הקובץ נשמר. שלחו אותו מווטסאפ דרך צירוף קובץ."; } }
      render(); break; }
    case "toggleExport": S.exportOpen=!S.exportOpen; S.copied=false; S.pdfMsg=""; render(); break;
    case "copyText": {
      const txt=ordersText();
      try { await navigator.clipboard.writeText(txt); S.copied=true; render(); }
      catch(e){
        const ta=document.createElement("textarea"); ta.value=txt; ta.style.cssText="position:fixed;opacity:0";
        document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); S.copied=true;}catch(_){}
        ta.remove(); render();
      }
      break; }
  }
});
document.addEventListener("keydown", ev=>{
  if (ev.key!=="Enter" || ev.target.tagName!=="INPUT") return;
  const map={noteInput:"addNote",gateCode:"gate",adminCode:S.lock?"login":null,adminCode2:"setLock",newLock:"changeLock"};
  let act = map[ev.target.id];
  if (ev.target.id.startsWith("add-")){ document.querySelector(`[data-act="addItem"][data-k="${ev.target.id.slice(4)}"]`)?.click(); return; }
  if (act) document.querySelector(`[data-act="${act}"]`)?.click();
});
document.addEventListener("input", ev=>{ if (ev.target.id==="who") S.name=ev.target.value; });

render();
initDb();
</script>
